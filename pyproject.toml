[project]
name = "weather-edge"
version = "0.1.0"
description = "Weather prediction market edge detection and paper trading system"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "httpx>=0.27",
    "requests>=2.31",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "click>=8.1",
    "rich>=13.7",
    "apscheduler>=3.10",
    "python-dateutil>=2.8",
    "redis>=5.0",
    "hiredis>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "hypothesis>=6.0",
]
dashboard = [
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "jinja2>=3.1",
]
execution = [
    "py-clob-client>=0.5",
    "web3>=6.0",
    "eth-account>=0.10",
    "eth-abi>=4.0",
    "eth-utils>=2.0",
    "hexbytes>=0.3",
]

[project.scripts]
weather-edge = "weather_edge.cli:cli"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Correctness and bug-pattern rules, not a formatter and not "ALL".
# F      pyflakes: undefined names, unused imports/vars
# E4/7/9 pycodestyle: import placement, statement errors, syntax errors
# B      flake8-bugbear: mutable defaults, raise-without-from, loop-var closures
# DTZ    naive datetimes (the UTC-vs-local-day class of bug this project had)
# BLE    blind except (except Exception that swallows and carries on)
# C901   mccabe cyclomatic complexity, ratcheted by .githooks/complexity-check.py
# PL     pylint: the useful half; the noisy rules are listed in ignore
# I      isort import ordering
# UP     pyupgrade
#
# The tree is not clean against this list yet. The pre-commit hook reports
# findings only on lines a commit touches, and CI blocks only the rules in
# its ratchet list (rules already at zero). Move a rule into the ratchet
# once its backlog is cleared.
select = ["F", "E4", "E7", "E9", "B", "DTZ", "BLE", "C901", "PL", "I", "UP"]

# PLR2004 magic-value-comparison: thresholds and prices are the domain here.
# PLC0415 import-outside-top-level: deferred imports keep optional deps
#         (py-clob-client, web3, redis) out of module import time.
# PLR0911/0912/0913/0915 too-many-returns/branches/arguments/statements:
#         restate what C901 measures. C901 is the single complexity signal.
# UP042 str+Enum -> StrEnum: changes what str() returns, and enum values are
#         persisted to SQLite. Not a mechanical change.
ignore = ["PLR2004", "PLC0415", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "UP042"]

[tool.ruff.lint.per-file-ignores]
# logging.basicConfig() runs before the app imports on purpose, so every
# module's logger is configured for journald before it is created.
"src/weather_edge/dashboard/app.py" = ["E402"]
# Tests build naive datetimes for fixtures on purpose.
"tests/**" = ["DTZ"]

[tool.ruff.lint.mccabe]
# Legacy functions may keep their current complexity only while it does
# not grow; new functions must stay at or under this.
max-complexity = 10

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
