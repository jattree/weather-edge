name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests (no network or keys needed)
        run: python -m pytest -q

  lint:
    name: ruff ratchet + complexity (blocking), full ruff (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      # Rules already at zero. This step blocks, so they can never regress.
      # Move a rule in here once its backlog is cleared.
      - name: Ruff ratchet (blocking)
        run: ruff check . --select F,E4,E7,E9,I,UP --ignore UP042 --output-format=github

      - name: Complexity (blocking, same gate as pre-commit)
        env:
          COMPLEXITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch's first push has an all-zero "before" SHA.
          case "$COMPLEXITY_BASE" in ""|0000000000000000000000000000000000000000) COMPLEXITY_BASE=HEAD^;; esac
          python3 .githooks/complexity-check.py --base "$COMPLEXITY_BASE" --head HEAD

      - name: Hook self-tests
        run: python3 -m unittest discover -s .githooks/tests -v

      - name: Ruff full config (report-only)
        continue-on-error: true
        run: ruff check . --output-format=github
